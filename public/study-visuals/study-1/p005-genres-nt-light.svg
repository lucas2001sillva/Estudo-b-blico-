<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Gêneros literários do Novo Testamento</title>
<desc id="figure-description">Classificação dos livros por gênero, com cada grupo ligado aos livros apresentados na fonte.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 1, página 5. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="680" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 1</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Gêneros literários do Novo Testamento</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#245341"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Grupo</text>
<text x="306" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Livros</text>
<g data-row="0"><rect x="40" y="170" width="920" height="58" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Evangelhos</text>
<text x="306" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Mateus, Marcos, Lucas e João.</text>
</g>
<g data-row="1"><rect x="40" y="238" width="920" height="58" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="269" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Histórico</text>
<text x="306" y="269" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Atos.</text>
</g>
<g data-row="2"><rect x="40" y="306" width="920" height="142" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="337" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Cartas de Paulo</text>
<text x="306" y="337" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Romanos, 1 Coríntios, 2 Coríntios, Gálatas,</text>
<text x="306" y="365" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Efésios, Filipenses, Colossenses, 1</text>
<text x="306" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Tessalonicenses, 2 Tessalonicenses, 1 Timóteo, 2</text>
<text x="306" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Timóteo, Tito e Filemom.</text>
</g>
<g data-row="3"><rect x="40" y="458" width="920" height="86" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="489" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Cartas Gerais</text>
<text x="306" y="489" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Hebreus, Tiago, 1 Pedro, 2 Pedro, 1 João, 2 João, 3</text>
<text x="306" y="517" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">João e Judas.</text>
</g>
<g data-row="4"><rect x="40" y="554" width="920" height="58" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="585" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Revelações</text>
<text x="306" y="585" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Apocalipse.</text>
</g>
<line x1="40" x2="960" y1="630" y2="630" stroke="#e5e7df"/>
<text x="40" y="657" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 1 · p. 5</text>
</svg>
