<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="692" viewBox="0 0 1000 692" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Como a Bíblia foi escrita</title>
<desc id="figure-description">Infográfico com duração, autores, línguas e continentes, sem os parágrafos explicativos abaixo.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 1, página 11. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="692" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 1</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Como a Bíblia foi escrita</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#245341"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Aspecto</text>
<text x="516" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Informação do material</text>
<g data-row="0"><rect x="40" y="170" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Período apresentado para o Antigo</text>
<text x="56" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Testamento</text>
<text x="516" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Entre 1500 e 450 a.C.</text>
</g>
<g data-row="1"><rect x="40" y="266" width="920" height="86" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Período apresentado para o Novo</text>
<text x="56" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Testamento</text>
<text x="516" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Entre 45 e 95 d.C.</text>
</g>
<g data-row="2"><rect x="40" y="362" width="920" height="58" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Duração aproximada</text>
<text x="516" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">1.600 anos</text>
</g>
<g data-row="3"><rect x="40" y="430" width="920" height="58" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="461" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Escritores</text>
<text x="516" y="461" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Mais de 40</text>
</g>
<g data-row="4"><rect x="40" y="498" width="920" height="58" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="529" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Línguas</text>
<text x="516" y="529" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Hebraico, grego e aramaico</text>
</g>
<g data-row="5"><rect x="40" y="566" width="920" height="58" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="597" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Continentes</text>
<text x="516" y="597" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">África, Ásia e Europa</text>
</g>
<line x1="40" x2="960" y1="642" y2="642" stroke="#e5e7df"/>
<text x="40" y="669" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 1 · p. 11</text>
</svg>
