<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Gêneros literários do Antigo Testamento</title>
<desc id="figure-description">Classificação dos livros por gênero, com cada grupo ligado aos livros apresentados na fonte.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 1, página 5. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="680" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 1</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Gêneros literários do Antigo Testamento</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#bad6b8"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Grupo</text>
<text x="306" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Livros</text>
<g data-row="0"><rect x="40" y="170" width="920" height="58" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Pentateuco</text>
<text x="306" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Gênesis, Êxodo, Levítico, Números e Deuteronômio.</text>
</g>
<g data-row="1"><rect x="40" y="238" width="920" height="114" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="269" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Históricos</text>
<text x="306" y="269" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Josué, Juízes, Rute, 1 Samuel, 2 Samuel, 1 Reis, 2</text>
<text x="306" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Reis, 1 Crônicas, 2 Crônicas, Esdras, Neemias e</text>
<text x="306" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Ester.</text>
</g>
<g data-row="2"><rect x="40" y="362" width="920" height="58" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Poéticos</text>
<text x="306" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Jó, Salmos, Provérbios, Eclesiastes e Cantares.</text>
</g>
<g data-row="3"><rect x="40" y="430" width="920" height="86" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="461" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Profetas Maiores</text>
<text x="306" y="461" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Isaías, Jeremias, Lamentações de Jeremias, Ezequiel</text>
<text x="306" y="489" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">e Daniel.</text>
</g>
<g data-row="4"><rect x="40" y="526" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="557" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Profetas Menores</text>
<text x="306" y="557" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Oséias, Joel, Amós, Obadias, Jonas, Miquéias, Naum,</text>
<text x="306" y="585" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Habacuque, Sofonias, Ageu, Zacarias e Malaquias.</text>
</g>
<line x1="40" x2="960" y1="630" y2="630" stroke="#364138"/>
<text x="40" y="657" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 1 · p. 5</text>
</svg>
