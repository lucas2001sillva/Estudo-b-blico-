<text x="111.5" y="859" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="650" text-anchor="middle" fill="#151a17">João</text>
<text x="208" y="842" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#edf1e9">Discípulo amado de Cristo, escreveu sobre o</text>
