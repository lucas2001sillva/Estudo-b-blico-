<text x="208" y="427" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#edf1e9">Profeta que anunciou a vinda do Messias.</text>
