<text x="208" y="302" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#edf1e9">Poeta e rei de Israel, autor de diversos</text>
<text x="208" y="331" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#edf1e9">salmos.</text>
</g>
