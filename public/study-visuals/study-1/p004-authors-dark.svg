<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1136" viewBox="0 0 760 1136" role="img" aria-labelledby="title description">
<title id="title">Destaques sobre os autores da Bíblia</title>
<desc id="description">Destaques sobre os autores da Bíblia. Autores e contextos da inspiração divina. Moisés: Legislador e libertador do povo hebreu. Davi: Poeta e rei de Israel, autor de diversos salmos. Isaías: Profeta que anunciou a vinda do Messias. Mateus: Cobrador de impostos transformado em discípulo. Lucas: Médico e historiador detalhista. Paulo: Apóstolo e missionário, autor de grande parte das cartas cristãs. João: Discípulo amado de Cristo, escreveu sobre o amor e a esperança eterna. Cada um, em seu contexto, foi movido pelo Espírito Santo para registrar verdades espirituais que continuam relevantes até hoje.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 1, arquivo study-1.pdf, página 4. Redesenho vetorial; dados e relações preservados.</metadata>
<rect width="760" height="1136" rx="20" fill="#1e2520"/>
<text x="38" y="37" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#b4bdb3">JORNADA DA BÍBLIA · PARTE 1</text>
<text x="38" y="83" font-family="Georgia,serif" font-size="31" font-weight="400" text-anchor="start" fill="#edf1e9">Destaques sobre os autores da Bíblia</text>
<text x="54" y="128" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#b4bdb3">Autores</text>
<text x="210" y="128" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#b4bdb3">Contextos da Inspiração Divina</text>
