<rect x="38" y="926" width="684" height="140" rx="12" fill="#293f30"/>
<text x="58" y="963" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#edf1e9">Cada um, em seu contexto, foi movido pelo Espírito Santo</text>
<text x="58" y="992" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#edf1e9">para registrar verdades espirituais que continuam</text>
<text x="58" y="1021" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#edf1e9">relevantes até hoje.</text>
