<text x="111.5" y="211" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="650" text-anchor="middle" fill="#151a17">Moisés</text>
<text x="208" y="211" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#edf1e9">Legislador e libertador do povo hebreu.</text>
</g>
