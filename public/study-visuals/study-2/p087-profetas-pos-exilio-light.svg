<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="572" viewBox="0 0 1000 572" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Profetas do período Pós-Exílio</title>
<desc id="figure-description">Profetas do período Pós-Exílio, conforme a página 87 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 87. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="572" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Profetas do período Pós-Exílio</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#245341"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Profeta e período</text>
<text x="306" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Ministério apresentado</text>
<g data-row="0"><rect x="40" y="170" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Ageu (c. 520</text>
<text x="56" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">a.C.)</text>
<text x="306" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Ministério em Jerusalém, após o exílio com Dario.</text>
<text x="306" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Encorajou a reconstrução imediata do Templo.</text>
</g>
<g data-row="1"><rect x="40" y="266" width="920" height="114" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Zacarias (c.</text>
<text x="56" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">520–518 a.C.)</text>
<text x="306" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Ministério em Jerusalém, após o exílio com Dario.</text>
<text x="306" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Ofereceu visões de esperança e profecias</text>
<text x="306" y="353" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">messiânicas detalhadas.</text>
</g>
<g data-row="2"><rect x="40" y="390" width="920" height="114" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Malaquias (c.</text>
<text x="56" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">433–425 a.C.)</text>
<text x="306" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Ministério em Jerusalém, após o exílio com</text>
<text x="306" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Artaxerxes. Confrontou o povo e os sacerdotes por</text>
<text x="306" y="477" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">sua apatia e falta de dízimos.</text>
</g>
<line x1="40" x2="960" y1="522" y2="522" stroke="#e5e7df"/>
<text x="40" y="549" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 2 · p. 87</text>
</svg>
