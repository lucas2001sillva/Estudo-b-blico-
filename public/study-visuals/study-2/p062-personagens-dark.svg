<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Principais personagens de Juízes</title>
<desc id="figure-description">Principais personagens de Juízes, conforme a página 62 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 62. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="940" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Principais personagens de Juízes</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#bad6b8"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Personagem</text>
<text x="306" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Papel / Destaque</text>
<g data-row="0"><rect x="40" y="170" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Otoniel</text>
<text x="306" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Primeiro juiz; libertou Israel da opressão dos</text>
<text x="306" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">arameus.</text>
</g>
<g data-row="1"><rect x="40" y="266" width="920" height="58" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Eúde</text>
<text x="306" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Matou Eglom, rei de Moabe, e trouxe paz duradoura.</text>
</g>
<g data-row="2"><rect x="40" y="334" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="365" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Sangar</text>
<text x="306" y="365" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Venceu 600 filisteus com uma simples aguilhada de</text>
<text x="306" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">bois.</text>
</g>
<g data-row="3"><rect x="40" y="430" width="920" height="58" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="461" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Débora</text>
<text x="306" y="461" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Juíza e profetisa; símbolo de coragem e fé.</text>
</g>
<g data-row="4"><rect x="40" y="498" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="529" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Gideão</text>
<text x="306" y="529" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Conquistou a vitória com 300 homens; símbolo de</text>
<text x="306" y="557" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">confiança em Deus.</text>
</g>
<g data-row="5"><rect x="40" y="594" width="920" height="86" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="625" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Jefté</text>
<text x="306" y="625" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Guerreiro que derrotou os amonitas, mas fez um voto</text>
<text x="306" y="653" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">precipitado.</text>
</g>
<g data-row="6"><rect x="40" y="690" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="721" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Sansão</text>
<text x="306" y="721" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Herói de força sobrenatural; seu fim trágico também</text>
<text x="306" y="749" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">é sua redenção.</text>
</g>
<g data-row="7"><rect x="40" y="786" width="920" height="86" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="817" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Samuel</text>
<text x="306" y="817" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Último juiz e primeiro profeta, transição para a</text>
<text x="306" y="845" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">era dos reis.</text>
</g>
<line x1="40" x2="960" y1="890" y2="890" stroke="#364138"/>
<text x="40" y="917" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 62</text>
</svg>
