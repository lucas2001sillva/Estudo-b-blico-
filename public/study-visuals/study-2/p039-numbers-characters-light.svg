<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1124" viewBox="0 0 1000 1124" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Personagens destaque de Números</title>
<desc id="figure-description">Quadro de sete personagens ou grupos e seus papéis/destaques; o acontecimento narrado abaixo permanece texto.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 39. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="1124" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Personagens destaque de Números</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#245341"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Personagem</text>
<text x="362.667" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Papel</text>
<text x="669.333" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Destaque</text>
<g data-row="0"><rect x="40" y="170" width="920" height="114" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Moisés</text>
<text x="362.667" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Líder e profeta</text>
<text x="669.333" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Conduziu o povo e</text>
<text x="669.333" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">intercedeu diante de</text>
<text x="669.333" y="257" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Deus.</text>
</g>
<g data-row="1"><rect x="40" y="294" width="920" height="86" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Arão</text>
<text x="362.667" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Sumo sacerdote</text>
<text x="669.333" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Representou o povo</text>
<text x="669.333" y="353" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">diante de Deus.</text>
</g>
<g data-row="2"><rect x="40" y="390" width="920" height="170" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Miriã</text>
<text x="362.667" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Profetisa</text>
<text x="669.333" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Cantou a vitória após</text>
<text x="669.333" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">o Mar Vermelho e</text>
<text x="669.333" y="477" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">também enfrentou</text>
<text x="669.333" y="505" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">disciplina por</text>
<text x="669.333" y="533" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">orgulho.</text>
</g>
<g data-row="3"><rect x="40" y="570" width="920" height="114" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="601" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Josué</text>
<text x="362.667" y="601" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Líder sucessor</text>
<text x="669.333" y="601" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Um dos dois espias</text>
<text x="669.333" y="629" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">fiéis; símbolo de</text>
<text x="669.333" y="657" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">coragem e fé.</text>
</g>
<g data-row="4"><rect x="40" y="694" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="725" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Calebe</text>
<text x="362.667" y="725" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Espião fiel</text>
<text x="669.333" y="725" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Confiou em Deus apesar</text>
<text x="669.333" y="753" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">das circunstâncias.</text>
</g>
<g data-row="5"><rect x="40" y="790" width="920" height="142" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="821" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Balaão</text>
<text x="362.667" y="821" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Profeta estrangeiro</text>
<text x="669.333" y="821" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Contratado para</text>
<text x="669.333" y="849" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">amaldiçoar, mas foi</text>
<text x="669.333" y="877" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">usado para abençoar</text>
<text x="669.333" y="905" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Israel.</text>
</g>
<g data-row="6"><rect x="40" y="942" width="920" height="114" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="973" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Corá, Datã e Abirão</text>
<text x="362.667" y="973" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Rebeldes</text>
<text x="669.333" y="973" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Desafiaram a liderança</text>
<text x="669.333" y="1001" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">divina e sofreram</text>
<text x="669.333" y="1029" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">juízo.</text>
</g>
<line x1="40" x2="960" y1="1074" y2="1074" stroke="#e5e7df"/>
<text x="40" y="1101" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 2 · p. 39</text>
</svg>
