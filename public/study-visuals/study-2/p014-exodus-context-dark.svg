<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="596" viewBox="0 0 1000 596" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Autor e contexto histórico de Êxodo</title>
<desc id="figure-description">Tabela que relaciona os elementos de contexto de Êxodo às descrições do material.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 14. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="596" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Autor e contexto histórico de Êxodo</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#bad6b8"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Elemento</text>
<text x="306" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Descrição</text>
<g data-row="0"><rect x="40" y="170" width="920" height="58" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Autor Tradicional</text>
<text x="306" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Moisés</text>
</g>
<g data-row="1"><rect x="40" y="238" width="920" height="58" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="269" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Período Histórico</text>
<text x="306" y="269" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Da escravidão no Egito à construção do Tabernáculo</text>
</g>
<g data-row="2"><rect x="40" y="306" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="337" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Significado do</text>
<text x="56" y="365" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Nome</text>
<text x="306" y="337" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">“Êxodo” vem do grego exodos, que significa “saída”</text>
<text x="306" y="365" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">ou “partida”</text>
</g>
<g data-row="3"><rect x="40" y="402" width="920" height="58" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="433" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Tema Central</text>
<text x="306" y="433" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Libertação, aliança e presença divina</text>
</g>
<g data-row="4"><rect x="40" y="470" width="920" height="58" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="501" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Palavra-Chave</text>
<text x="306" y="501" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Redenção</text>
</g>
<line x1="40" x2="960" y1="546" y2="546" stroke="#364138"/>
<text x="40" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 14</text>
</svg>
