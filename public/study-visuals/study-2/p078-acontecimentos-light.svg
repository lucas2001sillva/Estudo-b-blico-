<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="2028" viewBox="0 0 1000 2028" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Principais acontecimentos de 2 Samuel</title>
<desc id="figure-description">Principais acontecimentos de 2 Samuel, conforme a página 78 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 78. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="2028" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Principais acontecimentos de 2 Samuel</text>
<defs><marker id="sequence-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245341"/></marker></defs>
<g data-step="0"><rect x="40" y="106" width="920" height="150" rx="13" fill="#eaf1e9" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="140" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 1 · Referência: 2 Samuel 2</text>
<text x="62" y="172" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: Davi é Ungido Rei sobre Judá. Após a morte de</text>
<text x="62" y="200" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Saul, Davi é reconhecido como rei de Judá, iniciando seu reinado no</text>
<text x="62" y="228" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">sul de Israel.</text>
</g>
<path d="M500 260V285" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="1"><rect x="40" y="298" width="920" height="150" rx="13" fill="#ffffff" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="332" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 2 · Referência: 2 Samuel 5</text>
<text x="62" y="364" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: Davi é Reconhecido Rei sobre Todo Israel. As</text>
<text x="62" y="392" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">tribos do norte finalmente aceitam sua liderança, unificando o país</text>
<text x="62" y="420" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">sob um único trono.</text>
</g>
<path d="M500 452V477" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="2"><rect x="40" y="490" width="920" height="150" rx="13" fill="#eaf1e9" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="524" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 3 · Referência: 2 Samuel 5</text>
<text x="62" y="556" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: Conquista de Jerusalém. Davi toma a fortaleza</text>
<text x="62" y="584" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">jebuseia e a transforma na Cidade de Davi, tornando Jerusalém o centro</text>
<text x="62" y="612" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">político e religioso da nação.</text>
</g>
<path d="M500 644V669" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="3"><rect x="40" y="682" width="920" height="150" rx="13" fill="#ffffff" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="716" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 4 · Referência: 2 Samuel 7</text>
<text x="62" y="748" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: A Aliança de Deus com Davi. Deus promete</text>
<text x="62" y="776" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">estabelecer para sempre o trono da casa de Davi — uma promessa que se</text>
<text x="62" y="804" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">cumpre plenamente em Cristo.</text>
</g>
<path d="M500 836V861" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="4"><rect x="40" y="874" width="920" height="150" rx="13" fill="#eaf1e9" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="908" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 5 · Referência: 2 Samuel 11</text>
<text x="62" y="940" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: O Pecado com Bate-Seba. Davi comete adultério e</text>
<text x="62" y="968" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">manda matar Urias. O profeta Natã o confronta, e ele se arrepende com</text>
<text x="62" y="996" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">sinceridade.</text>
</g>
<path d="M500 1028V1053" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="5"><rect x="40" y="1066" width="920" height="150" rx="13" fill="#ffffff" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="1100" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 6 · Referência: 2 Samuel 12</text>
<text x="62" y="1132" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: O Nascimento de Salomão. Depois da morte do</text>
<text x="62" y="1160" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">primeiro filho com Bate-Seba, nasce Salomão, que será o futuro rei e</text>
<text x="62" y="1188" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">símbolo da restauração.</text>
</g>
<path d="M500 1220V1245" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="6"><rect x="40" y="1258" width="920" height="150" rx="13" fill="#eaf1e9" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="1292" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 7 · Referência: 2 Samuel 15–18</text>
<text x="62" y="1324" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: Rebelião de Absalão. Absalão se revolta contra o</text>
<text x="62" y="1352" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">pai, tentando usurpar o trono. Sua morte em batalha causa profunda</text>
<text x="62" y="1380" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">tristeza a Davi.</text>
</g>
<path d="M500 1412V1437" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="7"><rect x="40" y="1450" width="920" height="150" rx="13" fill="#ffffff" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="1484" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 8 · Referência: 2 Samuel 19</text>
<text x="62" y="1516" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: Retorno de Davi a Jerusalém. Davi é restaurado ao</text>
<text x="62" y="1544" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">trono após a derrota da rebelião e busca reconstruir a unidade</text>
<text x="62" y="1572" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">nacional.</text>
</g>
<path d="M500 1604V1629" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="8"><rect x="40" y="1642" width="920" height="122" rx="13" fill="#eaf1e9" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="1676" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 9 · Referência: 2 Samuel 20</text>
<text x="62" y="1708" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: Nova Rebelião: Seba. Outro insurgente, Seba, tenta</text>
<text x="62" y="1736" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">dividir o reino, mas a revolta é rapidamente sufocada.</text>
</g>
<path d="M500 1768V1793" fill="none" stroke="#245341" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="9"><rect x="40" y="1806" width="920" height="150" rx="13" fill="#ffffff" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="1840" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Passo: 10 · Referência: 2 Samuel 23</text>
<text x="62" y="1872" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Evento e descrição: Os Valentes de Davi. O livro encerra exaltando os</text>
<text x="62" y="1900" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">guerreiros leais que lutaram ao lado de Davi, exemplos de coragem e</text>
<text x="62" y="1928" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">fidelidade.</text>
</g>
<line x1="40" x2="960" y1="1978" y2="1978" stroke="#e5e7df"/>
<text x="40" y="2005" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 2 · p. 78</text>
</svg>
