<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="724" viewBox="0 0 1000 724" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Quanto tempo durou o dilúvio?</title>
<desc id="figure-description">Linha temporal de quatro etapas, com as durações e referências mostradas no material.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 9. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="724" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Quanto tempo durou o dilúvio?</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#bad6b8"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Etapa</text>
<text x="362.667" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Evento</text>
<text x="669.333" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Referência</text>
<g data-row="0"><rect x="40" y="170" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">1</text>
<text x="362.667" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Chuva por 40 dias e 40</text>
<text x="362.667" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">noites</text>
<text x="669.333" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Gn 7:12</text>
</g>
<g data-row="1"><rect x="40" y="266" width="920" height="86" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">2</text>
<text x="362.667" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Águas prevaleceram por</text>
<text x="362.667" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">150 dias</text>
<text x="669.333" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Gn 7:24</text>
</g>
<g data-row="2"><rect x="40" y="362" width="920" height="114" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">3</text>
<text x="362.667" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">A arca repousou no</text>
<text x="362.667" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">monte Ararate no 150º</text>
<text x="362.667" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">dia</text>
<text x="669.333" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Gn 8:4</text>
</g>
<g data-row="3"><rect x="40" y="486" width="920" height="170" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="517" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">4</text>
<text x="362.667" y="517" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">As águas foram</text>
<text x="362.667" y="545" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">baixando lentamente</text>
<text x="362.667" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">até que a arca foi</text>
<text x="362.667" y="601" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">aberta e Noé saiu no</text>
<text x="362.667" y="629" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">601º ano de sua vida</text>
<text x="669.333" y="517" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Gn 8:13–14</text>
</g>
<line x1="40" x2="960" y1="674" y2="674" stroke="#364138"/>
<text x="40" y="701" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 9</text>
</svg>
