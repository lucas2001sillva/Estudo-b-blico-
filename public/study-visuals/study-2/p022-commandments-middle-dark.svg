<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1542" viewBox="0 0 1000 1542" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Os dez mandamentos — continuação</title>
<desc id="figure-description">Continuação da tabela iniciada na página anterior, com os mandamentos 2 a 8.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 22. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="1542" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Os dez mandamentos — continuação</text>
<rect x="40" y="106" width="920" height="80" rx="10" fill="#bad6b8"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Nº</text>
<text x="286" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Mandamento (Êxodo</text>
<text x="286" y="161" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">20)</text>
<text x="516" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Aplicação no Novo</text>
<text x="516" y="161" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Testamento</text>
<text x="746" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Significado</text>
<text x="746" y="161" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">espiritual</text>
<g data-row="0"><rect x="40" y="196" width="920" height="198" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="227" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">2</text>
<text x="286" y="227" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Não farás</text>
<text x="286" y="255" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">imagens de</text>
<text x="286" y="283" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">escultura.</text>
<text x="516" y="227" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Lucas 16:13</text>
<text x="746" y="227" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Lembrar que</text>
<text x="746" y="255" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Deus é espírito</text>
<text x="746" y="283" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">e não pode ser</text>
<text x="746" y="311" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">reduzido a</text>
<text x="746" y="339" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">símbolos</text>
<text x="746" y="367" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">humanos.</text>
</g>
<g data-row="1"><rect x="40" y="404" width="920" height="170" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="435" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">3</text>
<text x="286" y="435" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Não tomarás o</text>
<text x="286" y="463" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">nome do Senhor</text>
<text x="286" y="491" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">em vão.</text>
<text x="516" y="435" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Mateus 5:34</text>
<text x="746" y="435" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Respeitar o</text>
<text x="746" y="463" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">nome de Deus,</text>
<text x="746" y="491" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">evitando usá-lo</text>
<text x="746" y="519" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">de forma</text>
<text x="746" y="547" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">leviana.</text>
</g>
<g data-row="2"><rect x="40" y="584" width="920" height="170" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="615" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">4</text>
<text x="286" y="615" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Lembra-te do</text>
<text x="286" y="643" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">sábado para o</text>
<text x="286" y="671" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">santificar.</text>
<text x="516" y="615" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Marcos 2:27</text>
<text x="746" y="615" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">O descanso é um</text>
<text x="746" y="643" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">presente de</text>
<text x="746" y="671" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Deus, um tempo</text>
<text x="746" y="699" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">para restaurar</text>
<text x="746" y="727" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">corpo e alma.</text>
</g>
<g data-row="3"><rect x="40" y="764" width="920" height="198" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="795" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">5</text>
<text x="286" y="795" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Honra teu pai e</text>
<text x="286" y="823" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">tua mãe.</text>
<text x="516" y="795" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Mateus 10:37</text>
<text x="746" y="795" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Valorizar a</text>
<text x="746" y="823" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">família e a</text>
<text x="746" y="851" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">autoridade como</text>
<text x="746" y="879" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">reflexo do</text>
<text x="746" y="907" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">respeito a</text>
<text x="746" y="935" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Deus.</text>
</g>
<g data-row="4"><rect x="40" y="972" width="920" height="170" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="1003" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">6</text>
<text x="286" y="1003" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Não matarás.</text>
<text x="516" y="1003" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Mateus 5:22</text>
<text x="746" y="1003" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">A vida é</text>
<text x="746" y="1031" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">sagrada — o</text>
<text x="746" y="1059" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">ódio e a ira</text>
<text x="746" y="1087" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">também violam</text>
<text x="746" y="1115" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">esse princípio.</text>
</g>
<g data-row="5"><rect x="40" y="1152" width="920" height="142" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="1183" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">7</text>
<text x="286" y="1183" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Não</text>
<text x="286" y="1211" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">adulterarás.</text>
<text x="516" y="1183" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Mateus 5:28</text>
<text x="746" y="1183" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">A pureza começa</text>
<text x="746" y="1211" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">no coração, não</text>
<text x="746" y="1239" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">apenas nas</text>
<text x="746" y="1267" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">ações.</text>
</g>
<g data-row="6"><rect x="40" y="1304" width="920" height="170" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="1335" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">8</text>
<text x="286" y="1335" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Não furtarás.</text>
<text x="516" y="1335" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Mateus 5:40</text>
<text x="746" y="1335" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Generosidade e</text>
<text x="746" y="1363" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">honestidade são</text>
<text x="746" y="1391" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">a base da</text>
<text x="746" y="1419" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">convivência</text>
<text x="746" y="1447" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">justa.</text>
</g>
<line x1="40" x2="960" y1="1492" y2="1492" stroke="#364138"/>
<text x="40" y="1519" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 22</text>
</svg>
