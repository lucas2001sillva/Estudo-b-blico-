<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Principais eventos e lições espirituais de Josué</title>
<desc id="figure-description">Principais eventos e lições espirituais de Josué, conforme a página 55 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 55. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="1040" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Principais eventos e lições espirituais de Josué</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#245341"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Evento</text>
<text x="362.667" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Referência</text>
<text x="669.333" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Lição</text>
<g data-row="0"><rect x="40" y="170" width="920" height="114" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Josué é comissionado</text>
<text x="362.667" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Josué 1</text>
<text x="669.333" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">O sucesso espiritual</text>
<text x="669.333" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">vem da obediência à</text>
<text x="669.333" y="257" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Palavra de Deus.</text>
</g>
<g data-row="1"><rect x="40" y="294" width="920" height="114" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Travessia do Jordão</text>
<text x="362.667" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Josué 3–4</text>
<text x="669.333" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Deus abre caminhos</text>
<text x="669.333" y="353" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">onde parece</text>
<text x="669.333" y="381" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">impossível.</text>
</g>
<g data-row="2"><rect x="40" y="418" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Queda de Jericó</text>
<text x="362.667" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Josué 6</text>
<text x="669.333" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">A fé e a obediência</text>
<text x="669.333" y="477" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">produzem milagres.</text>
</g>
<g data-row="3"><rect x="40" y="514" width="920" height="114" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="545" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Pecado de Acã</text>
<text x="362.667" y="545" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Josué 7</text>
<text x="669.333" y="545" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">O pecado escondido</text>
<text x="669.333" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">afeta toda a</text>
<text x="669.333" y="601" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">comunidade.</text>
</g>
<g data-row="4"><rect x="40" y="638" width="920" height="114" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="669" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Sol parado em Gibeão</text>
<text x="362.667" y="669" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Josué 10</text>
<text x="669.333" y="669" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Deus responde à oração</text>
<text x="669.333" y="697" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">de quem luta em Seu</text>
<text x="669.333" y="725" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">nome.</text>
</g>
<g data-row="5"><rect x="40" y="762" width="920" height="114" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="793" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Divisão da Terra</text>
<text x="362.667" y="793" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Josué 13–21</text>
<text x="669.333" y="793" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Deus é fiel para</text>
<text x="669.333" y="821" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">cumprir cada promessa</text>
<text x="669.333" y="849" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">feita.</text>
</g>
<g data-row="6"><rect x="40" y="886" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="917" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">“Eu e minha casa</text>
<text x="56" y="945" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">serviremos ao Senhor”</text>
<text x="362.667" y="917" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Josué 24:15</text>
<text x="669.333" y="917" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">A fé verdadeira começa</text>
<text x="669.333" y="945" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">dentro de casa.</text>
</g>
<line x1="40" x2="960" y1="990" y2="990" stroke="#e5e7df"/>
<text x="40" y="1017" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 2 · p. 55</text>
</svg>
