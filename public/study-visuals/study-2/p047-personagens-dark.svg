<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="544" viewBox="0 0 1000 544" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Personagens principais de Deuteronômio</title>
<desc id="figure-description">Personagens principais de Deuteronômio, conforme a página 47 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 47. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="544" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Personagens principais de Deuteronômio</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#bad6b8"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Personagem</text>
<text x="306" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Descrição</text>
<g data-row="0"><rect x="40" y="170" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Moisés</text>
<text x="306" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Líder e profeta, mediador entre Deus e o povo. Faz</text>
<text x="306" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">seus últimos discursos e morre no Monte Nebo.</text>
</g>
<g data-row="1"><rect x="40" y="266" width="920" height="86" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Josué</text>
<text x="306" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Discípulo e sucessor de Moisés, escolhido para</text>
<text x="306" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">liderar Israel na conquista de Canaã.</text>
</g>
<g data-row="2"><rect x="40" y="362" width="920" height="114" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">O Povo de Israel</text>
<text x="306" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">A nova geração nascida no deserto. É instruída a</text>
<text x="306" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">permanecer fiel e transmitir os mandamentos às</text>
<text x="306" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">gerações futuras.</text>
</g>
<line x1="40" x2="960" y1="494" y2="494" stroke="#364138"/>
<text x="40" y="521" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 47</text>
</svg>
