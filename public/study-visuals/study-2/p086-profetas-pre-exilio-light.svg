<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="696" viewBox="0 0 1000 696" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Profetas do período Pré-Exílio — Parte 3</title>
<desc id="figure-description">Profetas do período Pré-Exílio — Parte 3, conforme a página 86 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 86. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="696" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Profetas do período Pré-Exílio — Parte 3</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#245341"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Profeta e período</text>
<text x="306" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Ministério apresentado</text>
<g data-row="0"><rect x="40" y="170" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Naum (c. 640–630</text>
<text x="56" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">a.C.)</text>
<text x="306" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Profetizou a queda de Nínive, a capital da Assíria,</text>
<text x="306" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">durante o reinado de Josias.</text>
</g>
<g data-row="1"><rect x="40" y="266" width="920" height="114" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Sofonias (c.</text>
<text x="56" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">640–610 a.C.)</text>
<text x="306" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Ministério em Judá (Reino do Sul), sob Josias.</text>
<text x="306" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Enfatizou o “Dia do Senhor” como um dia de ira e</text>
<text x="306" y="353" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">restauração.</text>
</g>
<g data-row="2"><rect x="40" y="390" width="920" height="114" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Jeremias (c.</text>
<text x="56" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">627–586 a.C.)</text>
<text x="306" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Ministério em Judá, sob Josias, Joacaz, Jeoaquim e</text>
<text x="306" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Zedequias. Conhecido como o “Profeta Chorão”,</text>
<text x="306" y="477" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">testemunhou a queda de Jerusalém.</text>
</g>
<g data-row="3"><rect x="40" y="514" width="920" height="114" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="545" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Habacuque (c.</text>
<text x="56" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">609–598 a.C.)</text>
<text x="306" y="545" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Ministério em Judá (Reino do Sul), sob Josias.</text>
<text x="306" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Questionou a Deus sobre a injustiça e a ascensão</text>
<text x="306" y="601" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">dos babilônios.</text>
</g>
<line x1="40" x2="960" y1="646" y2="646" stroke="#e5e7df"/>
<text x="40" y="673" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 2 · p. 86</text>
</svg>
