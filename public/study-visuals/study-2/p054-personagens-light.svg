<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="928" viewBox="0 0 1000 928" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Personagens principais de Josué</title>
<desc id="figure-description">Personagens principais de Josué, conforme a página 54 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 54. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="928" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Personagens principais de Josué</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#245341"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Personagem</text>
<text x="306" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Descrição</text>
<g data-row="0"><rect x="40" y="170" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Josué</text>
<text x="306" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Sucessor de Moisés e comandante das campanhas em</text>
<text x="306" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Canaã. Símbolo de fé, coragem e obediência.</text>
</g>
<g data-row="1"><rect x="40" y="266" width="920" height="86" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Raabe</text>
<text x="306" y="297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Mulher de Jericó que ajudou os espiões israelitas e</text>
<text x="306" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">foi salva por sua fé. Tornou-se ancestral de Jesus.</text>
</g>
<g data-row="2"><rect x="40" y="362" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Calebe</text>
<text x="306" y="393" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Companheiro fiel de Josué desde o tempo dos espias.</text>
<text x="306" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Conquista Hebrom e representa a perseverança.</text>
</g>
<g data-row="3"><rect x="40" y="458" width="920" height="86" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="489" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Acã</text>
<text x="306" y="489" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Homem que desobedeceu a Deus tomando o proibido,</text>
<text x="306" y="517" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">causando derrota a Israel.</text>
</g>
<g data-row="4"><rect x="40" y="554" width="920" height="86" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="585" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Adonizedeque</text>
<text x="306" y="585" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Rei de Jerusalém que se opôs a Israel e foi</text>
<text x="306" y="613" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">derrotado por Josué.</text>
</g>
<g data-row="5"><rect x="40" y="650" width="920" height="86" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="681" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Os Gibeonitas</text>
<text x="306" y="681" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Povo que enganou Israel, mas foi poupado e se</text>
<text x="306" y="709" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">tornou servo dos levitas.</text>
</g>
<g data-row="6"><rect x="40" y="746" width="920" height="114" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="777" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Eleazar</text>
<text x="306" y="777" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Sumo sacerdote, filho de Arão, auxiliou Josué na</text>
<text x="306" y="805" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">distribuição das terras e nas cerimônias da</text>
<text x="306" y="833" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">aliança.</text>
</g>
<line x1="40" x2="960" y1="878" y2="878" stroke="#e5e7df"/>
<text x="40" y="905" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 2 · p. 54</text>
</svg>
