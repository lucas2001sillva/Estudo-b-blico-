<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="544" viewBox="0 0 1000 544" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">A escolha de um rei</title>
<desc id="figure-description">A escolha de um rei, conforme a página 69 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 69. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="544" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">A escolha de um rei</text>
<defs><marker id="sequence-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bad6b8"/></marker></defs>
<g data-step="0"><rect x="40" y="106" width="920" height="94" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="140" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Saul é ungido</text>
<text x="62" y="172" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Escolhido por Deus como o primeiro rei de Israel.</text>
</g>
<path d="M500 204V229" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="1"><rect x="40" y="242" width="920" height="94" rx="13" fill="#1e2520" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="276" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Desobediência</text>
<text x="62" y="308" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Saul ignora ordens divinas e perde o favor de Deus.</text>
</g>
<path d="M500 340V365" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="2"><rect x="40" y="378" width="920" height="94" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="412" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Davi é ungido</text>
<text x="62" y="444" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Jovem pastor escolhido como futuro rei.</text>
</g>
<line x1="40" x2="960" y1="494" y2="494" stroke="#364138"/>
<text x="40" y="521" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 69</text>
</svg>
