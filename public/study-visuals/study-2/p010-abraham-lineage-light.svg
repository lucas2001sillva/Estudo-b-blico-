<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1756" viewBox="0 0 1000 1756" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Deus edifica sua linhagem</title>
<desc id="figure-description">Genealogia de Abraão, Isaque e Jacó; relações e descendentes representados no gráfico do PDF.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 10. Figura vetorial recriada; não contém captura de página.</metadata>
