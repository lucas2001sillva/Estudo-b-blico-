<text x="306" y="993" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Gideão</text>
</g>
<g data-row="11"><rect x="40" y="1030" width="920" height="58" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="1061" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Efraim</text>
<text x="306" y="1061" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Josué; Débora</text>
</g>
<g data-row="12"><rect x="40" y="1098" width="920" height="58" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="1129" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Benjamim</text>
<text x="306" y="1129" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Saul; Paulo; Ester; Mardoqueu; Jeremias</text>
</g>
<g data-row="13"><rect x="40" y="1166" width="920" height="58" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="1197" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Dã</text>
<text x="306" y="1197" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Sansão</text>
</g>
<rect x="40" y="1246" width="920" height="440" rx="10" fill="#eaf1e9"/>
<text x="58" y="1277" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">A jornada de Abraão e o nascimento de Israel.</text>
<text x="58" y="1316" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">Abraão estava com 100 anos quando Isaque nasceu; viveu até os 175 anos.</text>
<text x="58" y="1355" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">Sara estava com 90 anos quando Isaque nasceu; o material diz que, mesmo</text>
<text x="58" y="1382" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">duvidando da promessa, foi agraciada por Deus.</text>
<text x="58" y="1421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">Sara entregou sua serva Agar a Abraão; desta união nasceu Ismael, apresentado</text>
<text x="58" y="1448" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">como pai dos povos árabes.</text>
<text x="58" y="1487" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">Isaque: seu nome quer dizer “aquele que ri”; a legenda o associa ao riso de</text>
<text x="58" y="1514" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">seus pais, que teriam um filho em idade avançada.</text>
<text x="58" y="1553" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">Rebeca é apresentada como mãe dos primeiros gêmeos mencionados na Bíblia.</text>
<text x="58" y="1592" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">Jacó é associado à linhagem das 12 tribos; Deus mudou seu nome para Israel.</text>
<text x="58" y="1631" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">Esaú é apresentado como aquele que vendeu a primogenitura a Jacó por um prato</text>
<text x="58" y="1658" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#29332d">de lentilhas; dele descenderam os edomitas.</text>
<line x1="40" x2="960" y1="1706" y2="1706" stroke="#e5e7df"/>
<text x="40" y="1733" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 2 · p. 10</text>
</svg>
