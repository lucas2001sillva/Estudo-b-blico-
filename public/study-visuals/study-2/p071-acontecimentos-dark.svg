<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1916" viewBox="0 0 1000 1916" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Principais acontecimentos de 1 Samuel</title>
<desc id="figure-description">Principais acontecimentos de 1 Samuel, conforme a página 71 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 71. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="1916" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Principais acontecimentos de 1 Samuel</text>
<defs><marker id="sequence-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bad6b8"/></marker></defs>
<g data-step="0"><rect x="40" y="106" width="920" height="150" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="140" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 1 · Referência: 1 Samuel 1–2</text>
<text x="62" y="172" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: O nascimento de Samuel. Ana, uma mulher estéril,</text>
<text x="62" y="200" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">ora com fervor e é agraciada com um filho. Em gratidão, entrega Samuel</text>
<text x="62" y="228" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">ao serviço do Senhor.</text>
</g>
<path d="M500 260V285" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="1"><rect x="40" y="298" width="920" height="122" rx="13" fill="#1e2520" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="332" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 2 · Referência: 1 Samuel 3</text>
<text x="62" y="364" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: O chamado de Samuel. Ainda jovem, Samuel ouve a</text>
<text x="62" y="392" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">voz de Deus e recebe o chamado para ser profeta em Israel.</text>
</g>
<path d="M500 424V449" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="2"><rect x="40" y="462" width="920" height="150" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="496" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 3 · Referência: 1 Samuel 4</text>
<text x="62" y="528" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: A captura da Arca da Aliança. Durante uma batalha,</text>
<text x="62" y="556" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">os filisteus tomam a Arca da Aliança, o que traz juízo sobre Israel e</text>
<text x="62" y="584" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">provoca a morte do sacerdote Eli.</text>
</g>
<path d="M500 616V641" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="3"><rect x="40" y="654" width="920" height="150" rx="13" fill="#1e2520" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="688" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 4 · Referência: 1 Samuel 5–7</text>
<text x="62" y="720" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: O retorno da Arca e a liderança de Samuel. A</text>
<text x="62" y="748" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">presença da Arca causa desastres entre os filisteus, forçando-os a</text>
<text x="62" y="776" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">devolvê-la. Samuel emerge como líder e guia o povo ao arrependimento.</text>
</g>
<path d="M500 808V833" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="4"><rect x="40" y="846" width="920" height="122" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="880" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 5 · Referência: 1 Samuel 8–15</text>
<text x="62" y="912" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: A rejeição de Saul. O povo exige um rei. Deus</text>
<text x="62" y="940" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">concede Saul, mas sua desobediência o leva à rejeição divina.</text>
</g>
<path d="M500 972V997" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="5"><rect x="40" y="1010" width="920" height="122" rx="13" fill="#1e2520" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="1044" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 6 · Referência: 1 Samuel 16</text>
<text x="62" y="1076" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: A unção de Davi. Samuel unge Davi em segredo como</text>
<text x="62" y="1104" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">o futuro rei de Israel.</text>
</g>
<path d="M500 1136V1161" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="6"><rect x="40" y="1174" width="920" height="122" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="1208" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 7 · Referência: 1 Samuel 17</text>
<text x="62" y="1240" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: Davi e Golias. Davi derrota o gigante Golias,</text>
<text x="62" y="1268" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">provando que a fé é mais poderosa que a espada.</text>
</g>
<path d="M500 1300V1325" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="7"><rect x="40" y="1338" width="920" height="122" rx="13" fill="#1e2520" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="1372" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 8 · Referência: 1 Samuel 18–20</text>
<text x="62" y="1404" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: A amizade de Davi e Jônatas. Mesmo sendo filho do</text>
<text x="62" y="1432" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">rei, Jônatas apoia Davi e arrisca a vida para protegê-lo.</text>
</g>
<path d="M500 1464V1489" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="8"><rect x="40" y="1502" width="920" height="150" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="1536" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 9 · Referência: 1 Samuel 21–30</text>
<text x="62" y="1568" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: A perseguição de Saul. Tomado pela inveja, Saul</text>
<text x="62" y="1596" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">persegue Davi implacavelmente. Davi, porém, mantém-se íntegro e confia</text>
<text x="62" y="1624" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">na justiça de Deus.</text>
</g>
<path d="M500 1656V1681" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="9"><rect x="40" y="1694" width="920" height="150" rx="13" fill="#1e2520" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="1728" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 10 · Referência: 1 Samuel 31</text>
<text x="62" y="1760" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Evento e descrição: A morte de Saul. Saul e seus filhos morrem em</text>
<text x="62" y="1788" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">batalha. Davi lamenta profundamente a perda do rei e de seu amigo</text>
<text x="62" y="1816" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Jônatas.</text>
</g>
<line x1="40" x2="960" y1="1866" y2="1866" stroke="#364138"/>
<text x="40" y="1893" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 71</text>
</svg>
