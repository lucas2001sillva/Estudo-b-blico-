<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="876" viewBox="0 0 1000 876" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Personagens e acontecimentos de Levítico</title>
<desc id="figure-description">Cinco personagens ou grupos, cada um com seu papel e contribuição.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 34. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="876" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Personagens e acontecimentos de Levítico</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#bad6b8"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Personagem</text>
<text x="362.667" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Papel</text>
<text x="669.333" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Contribuição</text>
<g data-row="0"><rect x="40" y="170" width="920" height="114" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Moisés</text>
<text x="362.667" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Líder e profeta</text>
<text x="669.333" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Recebeu as instruções</text>
<text x="669.333" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">divinas e as</text>
<text x="669.333" y="257" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">transmitiu ao povo.</text>
</g>
<g data-row="1"><rect x="40" y="294" width="920" height="86" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Arão</text>
<text x="362.667" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Sumo sacerdote</text>
<text x="669.333" y="325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Intermediário entre</text>
<text x="669.333" y="353" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Deus e Israel.</text>
</g>
<g data-row="2"><rect x="40" y="390" width="920" height="142" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Nadabe e Abiú</text>
<text x="362.667" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Filhos de Arão</text>
<text x="669.333" y="421" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Desobedeceram e foram</text>
<text x="669.333" y="449" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">punidos, simbolizando</text>
<text x="669.333" y="477" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">a seriedade da</text>
<text x="669.333" y="505" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">adoração.</text>
</g>
<g data-row="3"><rect x="40" y="542" width="920" height="114" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Os levitas</text>
<text x="362.667" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Servos do Tabernáculo</text>
<text x="669.333" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Responsáveis pelo</text>
<text x="669.333" y="601" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">culto e manutenção do</text>
<text x="669.333" y="629" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">sagrado.</text>
</g>
<g data-row="4"><rect x="40" y="666" width="920" height="142" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="697" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">O povo de Israel</text>
<text x="362.667" y="697" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Nação sacerdotal</text>
<text x="669.333" y="697" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Chamados a viver em</text>
<text x="669.333" y="725" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">santidade e</text>
<text x="669.333" y="753" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">testemunhar o caráter</text>
<text x="669.333" y="781" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">de Deus.</text>
</g>
<line x1="40" x2="960" y1="826" y2="826" stroke="#364138"/>
<text x="40" y="853" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 34</text>
</svg>
