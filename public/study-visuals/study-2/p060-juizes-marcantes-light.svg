<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1420" viewBox="0 0 1000 1420" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Os juízes mais marcantes</title>
<desc id="figure-description">Os juízes mais marcantes, conforme a página 60 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 60. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="1420" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Os juízes mais marcantes</text>
<rect x="40" y="106" width="920" height="54" rx="10" fill="#245341"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Juiz</text>
<text x="516" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#ffffff">Descrição</text>
<g data-row="0"><rect x="40" y="170" width="920" height="142" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Otoniel — O Primeiro Libertador</text>
<text x="516" y="201" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Sobrinho de Calebe, liderou Israel</text>
<text x="516" y="229" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">contra o rei da Mesopotâmia. Sua</text>
<text x="516" y="257" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">coragem marca o início do padrão</text>
<text x="516" y="285" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">de libertação divina.</text>
</g>
<g data-row="1"><rect x="40" y="322" width="920" height="142" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="353" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Eúde — O Libertador Canhoto</text>
<text x="516" y="353" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Um homem de Benjamim que matou o</text>
<text x="516" y="381" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">rei Eglom de Moabe com uma adaga</text>
<text x="516" y="409" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">escondida. Sua ousadia trouxe 80</text>
<text x="516" y="437" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">anos de paz a Israel.</text>
</g>
<g data-row="2"><rect x="40" y="474" width="920" height="226" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="505" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Débora — A Profetisa e Juíza de</text>
<text x="56" y="533" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Israel</text>
<text x="516" y="505" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Única mulher entre os juízes,</text>
<text x="516" y="533" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Débora exerceu liderança</text>
<text x="516" y="561" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">espiritual e militar ao lado de</text>
<text x="516" y="589" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Baraque. Sua vitória sobre Sísera</text>
<text x="516" y="617" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">inspirou um dos cânticos mais</text>
<text x="516" y="645" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">antigos da Bíblia — o Cântico de</text>
<text x="516" y="673" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Débora (Juízes 5).</text>
</g>
<g data-row="3"><rect x="40" y="710" width="920" height="198" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="741" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Gideão — O Guerreiro Relutante</text>
<text x="516" y="741" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Chamado por Deus enquanto escondia</text>
<text x="516" y="769" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">trigo dos midianitas, Gideão</text>
<text x="516" y="797" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">venceu um exército de 135 mil</text>
<text x="516" y="825" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">homens com apenas 300 soldados,</text>
<text x="516" y="853" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">mostrando que a vitória pertence</text>
<text x="516" y="881" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">ao Senhor, não aos números.</text>
</g>
<g data-row="4"><rect x="40" y="918" width="920" height="198" rx="10" fill="#eaf1e9" stroke="#e5e7df"/>
<text x="56" y="949" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Jefté — O Homem do Voto Imprudente</text>
<text x="516" y="949" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Filho de uma prostituta, foi</text>
<text x="516" y="977" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">rejeitado por seus irmãos, mas</text>
<text x="516" y="1005" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Deus o usou para vencer os</text>
<text x="516" y="1033" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">amonitas. Sua história é lembrada</text>
<text x="516" y="1061" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">pelo voto precipitado que lhe</text>
<text x="516" y="1089" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">custou a filha.</text>
</g>
<g data-row="5"><rect x="40" y="1126" width="920" height="226" rx="10" fill="#ffffff" stroke="#e5e7df"/>
<text x="56" y="1157" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Sansão — O Juiz de Força</text>
<text x="56" y="1185" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#245341">Sobrenatural</text>
<text x="516" y="1157" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Dotado de força incomum, Sansão</text>
<text x="516" y="1185" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">foi levantado para confrontar os</text>
<text x="516" y="1213" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">filisteus. Apesar de suas falhas e</text>
<text x="516" y="1241" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">paixões, Deus o usou até o fim.</text>
<text x="516" y="1269" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">Sua morte, derrubando o templo</text>
<text x="516" y="1297" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">filisteu, simboliza vitória pela</text>
<text x="516" y="1325" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#29332d">entrega total.</text>
</g>
<line x1="40" x2="960" y1="1370" y2="1370" stroke="#e5e7df"/>
<text x="40" y="1397" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Jornada da Bíblia — Parte 2 · p. 60</text>
</svg>
