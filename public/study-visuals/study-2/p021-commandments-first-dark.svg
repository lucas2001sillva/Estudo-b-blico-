<title id="figure-title">Os dez mandamentos — início</title>
<desc id="figure-description">Início da tabela dos mandamentos, com a primeira linha e os títulos das colunas.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 21. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="490" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Os dez mandamentos — início</text>
<rect x="40" y="106" width="920" height="80" rx="10" fill="#bad6b8"/>
<text x="56" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Nº</text>
<text x="286" y="135" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" fill="#151a17">Mandamento (Êxodo</text>
