<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="684" viewBox="0 0 1000 684" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Profetas durante o Exílio</title>
<desc id="figure-description">Profetas durante o Exílio, conforme a página 87 da Jornada da Bíblia — Parte 2.</desc>
<metadata>Fonte: Jornada da Bíblia — Parte 2, página 87. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="684" rx="20" fill="#1e2520"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#b4bdb3">JORNADA DA BÍBLIA — PARTE 2</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#edf1e9">Profetas durante o Exílio</text>
<defs><marker id="sequence-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bad6b8"/></marker></defs>
<g data-step="0"><rect x="40" y="106" width="920" height="150" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="140" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 1 · Profeta e período: Daniel (c. 606–534 a.C.)</text>
<text x="62" y="172" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Ministério apresentado: Ministério na Babilônia, durante o exílio com</text>
<text x="62" y="200" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Nabucodonosor e Ciro. Famoso por suas visões apocalípticas e</text>
<text x="62" y="228" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">fidelidade sob pressão.</text>
</g>
<path d="M500 260V285" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="1"><rect x="40" y="298" width="920" height="150" rx="13" fill="#1e2520" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="332" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 2 · Profeta e período: Ezequiel (c. 592–572 a.C.)</text>
<text x="62" y="364" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Ministério apresentado: Ministério na Babilônia, durante o exílio com</text>
<text x="62" y="392" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Nabucodonosor. Suas visões incluíam o vale de ossos secos e a glória</text>
<text x="62" y="420" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">de Deus deixando e retornando ao templo.</text>
</g>
<path d="M500 452V477" fill="none" stroke="#bad6b8" stroke-width="2.5" marker-end="url(#sequence-arrow)" data-link="next"/>
<g data-step="2"><rect x="40" y="490" width="920" height="122" rx="13" fill="#293f30" stroke="#364138" stroke-width="1.5"/>
<text x="62" y="524" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#bad6b8">Passo: 3 · Profeta e período: Obadias (c. 586–583 a.C.)</text>
<text x="62" y="556" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Ministério apresentado: Profetizou contra Edom por sua hostilidade a</text>
<text x="62" y="584" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Judá durante a queda de Jerusalém.</text>
</g>
<line x1="40" x2="960" y1="634" y2="634" stroke="#364138"/>
<text x="40" y="661" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#b4bdb3">Fonte: Jornada da Bíblia — Parte 2 · p. 87</text>
</svg>
