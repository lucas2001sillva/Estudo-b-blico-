<text x="56" y="1261" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Aliança</text>
<text x="362.667" y="1233" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">26</text>
<text x="669.333" y="1233" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">O povo reafirma seu</text>
<text x="669.333" y="1261" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">pacto com o Senhor.</text>
</g>
<g data-row="10"><rect x="40" y="1298" width="920" height="142" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="1329" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Bênçãos e Maldições</text>
<text x="362.667" y="1329" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">27–28</text>
<text x="669.333" y="1329" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">A obediência traz</text>
<text x="669.333" y="1357" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">prosperidade; a</text>
<text x="669.333" y="1385" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">desobediência,</text>
<text x="669.333" y="1413" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">destruição.</text>
</g>
<g data-row="11"><rect x="40" y="1450" width="920" height="114" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="1481" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Convite à Obediência e</text>
<text x="56" y="1509" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Esperança</text>
<text x="362.667" y="1481" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">29–30</text>
<text x="669.333" y="1481" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Chamado final à</text>
<text x="669.333" y="1509" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">fidelidade e promessa</text>
<text x="669.333" y="1537" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">de restauração.</text>
</g>
<g data-row="12"><rect x="40" y="1574" width="920" height="114" rx="10" fill="#293f30" stroke="#364138"/>
<text x="56" y="1605" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Transição de Liderança</text>
<text x="362.667" y="1605" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">31</text>
<text x="669.333" y="1605" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Moisés nomeia Josué e</text>
<text x="669.333" y="1633" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">entoa um cântico</text>
<text x="669.333" y="1661" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">profético.</text>
</g>
<g data-row="13"><rect x="40" y="1698" width="920" height="114" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="1729" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Morte de Moisés</text>
<text x="362.667" y="1729" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">34</text>
<text x="669.333" y="1729" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Moisés vê Canaã do</text>
<text x="669.333" y="1757" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Monte Nebo e parte em</text>
<text x="669.333" y="1785" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">paz.</text>
</g>
