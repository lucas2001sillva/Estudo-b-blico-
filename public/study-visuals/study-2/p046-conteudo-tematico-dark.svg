<text x="56" y="1165" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Comunitária</text>
<text x="362.667" y="1137" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">22–25</text>
<text x="669.333" y="1137" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Ética, casamento e</text>
<text x="669.333" y="1165" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">cuidado com o próximo.</text>
</g>
<g data-row="9"><rect x="40" y="1202" width="920" height="86" rx="10" fill="#1e2520" stroke="#364138"/>
