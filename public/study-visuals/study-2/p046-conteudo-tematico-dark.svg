<text x="56" y="917" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">e Governo</text>
<text x="362.667" y="889" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">17–18</text>
<text x="669.333" y="889" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Diretrizes sobre</text>
<text x="669.333" y="917" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">juízes, reis e</text>
<text x="669.333" y="945" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">profetas.</text>
</g>
<g data-row="7"><rect x="40" y="982" width="920" height="114" rx="10" fill="#1e2520" stroke="#364138"/>
<text x="56" y="1013" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Leis de Guerra e</text>
<text x="56" y="1041" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#bad6b8">Justiça</text>
<text x="362.667" y="1013" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">20–21</text>
<text x="669.333" y="1013" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">Regras para conflitos</text>
<text x="669.333" y="1041" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">e julgamento de</text>
<text x="669.333" y="1069" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#edf1e9">crimes.</text>
</g>
<g data-row="8"><rect x="40" y="1106" width="920" height="86" rx="10" fill="#293f30" stroke="#364138"/>
