<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="634" viewBox="0 0 1000 634" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Estrutura e características principais de Marcos</title>
<desc id="figure-description">Esquema de apresentação de Jesus e características do Evangelho, com as setas preservadas.</desc>
<metadata>Fonte: Os 4 Evangelhos, página 2. Figura vetorial recriada; não contém captura de página.</metadata>
<rect width="1000" height="634" rx="20" fill="#ffffff"/>
<text x="40" y="34" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#69736b">OS 4 EVANGELHOS</text>
<text x="40" y="78" font-family="Georgia,serif" font-size="30" font-weight="400" fill="#29332d">Estrutura e características principais de Marcos</text>
<g data-step="0"><rect x="40" y="106" width="920" height="80" rx="13" fill="#eaf1e9" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="140" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Apresentação de Jesus</text>
</g>
<g data-step="1"><rect x="40" y="200" width="920" height="80" rx="13" fill="#ffffff" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="234" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Estilo direto e dinâmico (Curto, cheio de ação)</text>
</g>
<g data-step="2"><rect x="40" y="294" width="920" height="80" rx="13" fill="#eaf1e9" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="328" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Público-alvo romano/não judeu (Explica costumes judaicos)</text>
</g>
<g data-step="3"><rect x="40" y="388" width="920" height="80" rx="13" fill="#ffffff" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="422" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Servo de Deus (Veio para servir)</text>
</g>
<g data-step="4"><rect x="40" y="482" width="920" height="80" rx="13" fill="#eaf1e9" stroke="#e5e7df" stroke-width="1.5"/>
<text x="62" y="516" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#245341">Filho do Homem (Resgate por muitos)</text>
</g>
<line x1="40" x2="960" y1="584" y2="584" stroke="#e5e7df"/>
<text x="40" y="611" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#69736b">Fonte: Os 4 Evangelhos · p. 2</text>
</svg>
